<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>График</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 12px; padding-top: calc(env(safe-area-inset-top, 24px) + 10px); background: #f8f9fa; color: #202124; }
    .viewer-hint { display: none; background: #fef7e0; border: 1px solid #f9ab00; color: #202124; padding: 10px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; line-height: 1.4; font-weight: bold; text-align: center; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; min-height: 24px; }
    .view-badge { display: none; width: 100%; font-size: 14px; line-height: 1.4; font-weight: bold; color: #174ea6; background: #e8f0fe; border: 2px solid #1a73e8; padding: 8px 12px; border-radius: 6px; text-align: center; margin-bottom: 6px; }
    .header-left { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; flex: 1; min-width: 0; }
    .last-updated-date { font-size: 17px; color: #202124; font-weight: bold; line-height: 1.2; }
    .last-updated-note { font-size: 15px; color: #3c4043; font-weight: normal; line-height: 1.25; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 8px; flex-shrink: 0; }
    .right-top-row { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .edit-switch-wrap { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; padding: 4px 10px 4px 4px; border-radius: 16px; background: #ffffff; border: 1px solid #dadce0; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .edit-switch-wrap.active { border-color: #1a73e8; background: #f4f8fe; }
    .switch-track { position: relative; width: 28px; height: 16px; background: #bdc1c6; border-radius: 16px; transition: background 0.2s ease; flex-shrink: 0; }
    .edit-switch-wrap.active .switch-track { background: #1a73e8; }
    .switch-thumb { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; background: #ffffff; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,0.35); transition: transform 0.2s ease; }
    .edit-switch-wrap.active .switch-thumb { transform: translateX(12px); }
    .switch-label { font-size: 11px; font-weight: bold; color: #3c4043; white-space: nowrap; }
    .edit-switch-wrap.active .switch-label { color: #1a73e8; }
    #syncStatus { font-size: 11px; color: #1a73e8; font-weight: bold; white-space: nowrap; min-height: 14px; }
    .offline-btn { display: none; width: auto !important; min-width: 155px !important; background: #d93025 !important; color: #ffffff !important; border: none !important; border-radius: 8px !important; padding: 5px 12px !important; font-size: 12px !important; font-weight: bold !important; cursor: pointer; line-height: 1.15 !important; text-align: center !important; white-space: nowrap !important; box-shadow: 0 2px 6px rgba(217, 48, 37, 0.3); }
    .modal-backdrop { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(32, 33, 36, 0.5); z-index: 9999; align-items: center; justify-content: center; padding: 16px; }
    .modal-box { background: #ffffff; border-radius: 12px; padding: 20px 22px 16px; width: 100%; max-width: 300px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); text-align: center; }
    .modal-text { font-size: 17px; font-weight: bold; color: #202124; margin-bottom: 14px; line-height: 1.3; }
    .modal-input { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid #dadce0; border-radius: 6px; margin-bottom: 16px; text-align: center; outline: none; }
    .modal-input:focus { border-color: #1a73e8; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .modal-btn { border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .modal-btn-cancel { background: #f1f3f4; color: #3c4043; }
    .modal-btn-ok { background: #1a73e8; color: #ffffff; }
    .section { background: #fff; border: 1px solid #dadce0; border-radius: 8px; padding: 10px; margin-bottom: 16px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .section-title { font-size: 16px; font-weight: bold; }
    .scroll-container { overflow-x: auto; -webkit-overflow-scrolling: touch; transform: translateZ(0); border: 2px solid #5f6368; position: relative; background: #ffffff; }
    table { border-collapse: separate; border-spacing: 0; width: max-content; font-family: Arial, sans-serif; font-size: 14px; }
    th, td { border-right: 1px solid #80868b; border-bottom: 1px solid #80868b; padding: 5px 4px; width: 100px; min-width: 100px; max-width: 100px; white-space: pre-line; word-break: break-word; font-family: Arial, sans-serif; font-size: 14px; background: #ffffff; text-align: center; vertical-align: middle; }
    th { background: #f1f3f4; position: sticky; top: 0; z-index: 2; font-weight: bold; border-bottom: 2px solid #5f6368; line-height: 1.35; }
    td:first-child, th:first-child { position: sticky; left: 0; width: 95px; min-width: 95px; max-width: 95px; padding: 5px 4px; white-space: pre-line; word-break: break-word; font-size: 14px; border-right: 2px solid #5f6368; text-align: center; vertical-align: middle; }
    td:first-child { z-index: 3; font-weight: 500; background-color: #fbf5e6; border-bottom: 1px solid #80868b; }
    th:first-child { z-index: 4; background-color: #f1f3f4; color: #202124; border-bottom: 2px solid #5f6368; }
    #table1 tr:first-child th, #table1 tr.sub-header-row td, #table2 tr:first-child th, #table1 tr:first-child th:first-child, #table1 tr.sub-header-row td:first-child, #table2 tr:first-child th:first-child { height: 42px; min-height: 42px; max-height: 42px; background-color: #f1f3f4; color: #202124; font-weight: bold; border-bottom: 2px solid #5f6368; line-height: 1.3; white-space: nowrap; }
    #table2 tr:first-child th { text-align: center !important; vertical-align: top !important; padding-top: 4px; white-space: pre-line; }
    #table1 tr.beige-row td { background-color: #fbf5e6 !important; }
    td.edited-cell, #table1 tr.beige-row td.edited-cell, td.edited-cell .tema-editor { background-color: #d4edda !important; }
    #table1 tr.spacer-row td { height: 12px; padding: 0; background-color: #e8eaed !important; border-right: none; border-top: 2px solid #5f6368; border-bottom: 2px solid #5f6368; cursor: default; }
    #table1 tr.spacer-row td:first-child { border-right: 2px solid #5f6368; }
    #table2 th:not(:first-child), #table2 td:not(:first-child) { width: 155px; min-width: 155px; max-width: 155px; }
    #table2 tr:nth-child(3) td:first-child { text-align: center !important; vertical-align: top !important; padding-top: 6px; }
    td.tema-cell { padding: 0 !important; vertical-align: top !important; text-align: left !important; height: 54px; }
    .tema-editor { width: 100%; min-height: 54px; padding: 5px 6px; font-size: 14px; text-align: left; vertical-align: top; outline: none; white-space: pre-line; word-break: break-word; }
    .tema-editor:focus, td[contenteditable="true"]:focus { outline: 2px solid #1a73e8; outline-offset: -2px; background-color: #ffffff !important; }
    body.apk-mode .last-updated-date { font-size: 18px; }
    body.apk-mode .last-updated-note { font-size: 16px; }
    body.apk-mode .edit-switch-wrap { padding: 6px 12px 6px 6px; gap: 8px; }
    body.apk-mode .switch-track { width: 34px; height: 18px; }
    body.apk-mode .switch-thumb { width: 14px; height: 14px; }
    body.apk-mode .edit-switch-wrap.active .switch-thumb { transform: translateX(16px); }
    body.apk-mode .switch-label { font-size: 12.5px; }
    @media (max-width: 600px) {
      body { padding: 2px; padding-top: calc(env(safe-area-inset-top, 24px) + 8px); background: #ffffff; }
      .viewer-hint { margin: 4px; border-radius: 4px; }
      .header-bar { padding: 4px 4px; margin-bottom: 4px; gap: 6px; }
      .header-right { gap: 10px; }
      .last-updated-date { font-size: 14px; }
      .last-updated-note { font-size: 13px; line-height: 1.15; }
      .edit-switch-wrap { padding: 4px 8px 4px 4px; }
      .switch-label { font-size: 10px; }
      #syncStatus { font-size: 9.5px; }
      .offline-btn { width: auto !important; min-width: 124px !important; margin-right: 0 !important; padding: 4px 6px !important; font-size: 10px !important; line-height: 1.15 !important; border-radius: 7px !important; }
      body.apk-mode .last-updated-date { font-size: 15.5px; }
      body.apk-mode .last-updated-note { font-size: 14px; line-height: 1.2; }
      body.apk-mode .edit-switch-wrap { padding: 5px 10px 5px 5px; gap: 6px; }
      body.apk-mode .switch-label { font-size: 11.5px; }
      .section { border: none; border-radius: 0; padding: 2px 0; margin-bottom: 10px; }
      .section-header { padding: 0 4px; margin-bottom: 4px; }
      td:first-child, th:first-child { width: 82px; min-width: 82px; max-width: 82px; padding: 4px 2px; }
    }
  </style>
</head>
<body>
  <div id="viewerHint" class="viewer-hint">Чтобы таблицы прокручивались синхронно, откройте этот файл через любой браузер.</div>
  <div id="viewBadge" class="view-badge"></div>
  <div id="confirmModal" class="modal-backdrop" onclick="closeDownloadModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-text">Подтвердите скачивание.</div>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn-cancel" onclick="closeDownloadModal()">Отмена</button>
        <button type="button" class="modal-btn modal-btn-ok" onclick="confirmAndDownload()">ОК</button>
      </div>
    </div>
  </div>
  <div id="secretModal" class="modal-backdrop" onclick="closeSecretModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-text">Введите код редактора</div>
      <input type="password" id="secretCodeInput" class="modal-input" inputmode="numeric" placeholder="****">
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn-cancel" onclick="closeSecretModal()">Отмена</button>
        <button type="button" class="modal-btn modal-btn-ok" onclick="submitSecretCode()">Войти</button>
      </div>
    </div>
  </div>
  <div class="header-bar">
    <div class="header-left">
      <span id="lastUpdatedDate" class="last-updated-date"></span>
      <span id="lastUpdatedNote" class="last-updated-note"></span>
    </div>
    <div class="header-right">
      <div class="right-top-row">
        <div id="syncStatus">Загрузка...</div>
        <div id="editToggleBtn" class="edit-switch-wrap" role="switch" aria-checked="false" onclick="toggleEditMode()">
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label">Редактировать таблицу</span>
        </div>
      </div>
      <button id="downloadOfflineBtn" class="offline-btn" onclick="openDownloadModal()">Скачать для просмотра<br>без интернета</button>
    </div>
  </div>
  <div class="section"><div class="scroll-container" id="scroll1"><table id="table1"></table></div></div>
  <div class="section"><div class="section-header"><span class="section-title">ВПС</span></div><div class="scroll-container" id="scroll2"><table id="table2"></table></div></div>
  <script src="app.js"></script>
</body>
</html>
